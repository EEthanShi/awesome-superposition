# Curated reading list, rendered into the README and the website's Reading list view.
# Each section has a part (Start, Theory, Practice, New) that groups it in the README contents.
# Each entry: title, authors, year, venue, url, note. Pull requests welcome.

[[section]]
slug = "start"
part = "Start"
name = "Start here"
description = "Reviews and the reports that set up the field."

[[section.item]]
